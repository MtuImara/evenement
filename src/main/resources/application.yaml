spring:
  application:
    name: evenement
  datasource:
    url: jdbc:postgresql://localhost:5432/evenement_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: 8080

app:
  jwt:
    secret: "ChangeMeUniversityProjectSecretKeyAtLeast256BitsLongForHS256!!"
    expiration-ms: 86400000
  qr:
    hmac-secret: "ChangeMeQrHmacSecretForUniversityProject2026"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
